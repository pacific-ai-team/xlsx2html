name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    name: "python ${{ matrix.python-version }} ${{ matrix.toxenv }}"
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11', '3.12', '3.13']
        toxenv: [""]
        experimental: [ false ]
        include:
          - toxenv: qa
            python-version: 3.9
            experimental: false
          - toxenv: type
            python-version: 3.9
            experimental: false
          - experimental: true
            python-version: "3.14.0-alpha.1 - 3.14"
          - experimental: true
            python-version: "pypy-3.10"


    permissions:
      contents: read
      actions: read
    continue-on-error: ${{ matrix.experimental }}
    env:
      TOXENV: ${{ matrix.toxenv }}
      CHROMEDRIVER_PACKAGE: "chromedriver-binary-auto"
      # Preserve the current worker budget until multi-worker runs prove cheaper.
      CI_RUNTIME_SHARDS: "1"
      CI_RUNTIME_SHARD: "0"
      CI_RUNTIME_STORE: github://${{ github.repository }}
      CI_RUNTIME_REVISION: ${{ github.sha }}
      CI_RUNTIME_RUN: ${{ github.run_id }}
      CI_RUNTIME_GITHUB_TOKEN: ${{ github.token }}
      PYTHON_VARIANT: ${{ matrix.python-version }}
    steps:
      # chrome headless
      - uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: 131

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up python ${{ matrix.python-version}}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox python-coveralls codecov
          python -c 'import platform, sys; print("TOX_TESTENV=" + ("pypy3" if platform.python_implementation() == "PyPy" else "py%d%d" % sys.version_info[:2]))' >> "$GITHUB_ENV"
      - if: matrix.toxenv == ''
        uses: ./.github/actions/ci-runtime
      - name: Find this matrix job's immutable measured plans
        if: matrix.toxenv == ''
        id: existing
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const run_id = Number(process.env.GITHUB_RUN_ID);
            const run = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
            core.exportVariable('CI_RUNTIME_EPOCH', run.data.created_at);
            const variant = process.env.PYTHON_VARIANT.replace(/[^a-zA-Z0-9.-]/g, '_');
            const name = `test-history-plan-${run_id}-${variant}`;
            core.setOutput('name', name);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo, run_id, per_page: 100});
            const found = artifacts.filter(a => a.name === name && !a.expired);
            if (found.length > 1) throw new Error('Ambiguous history plan');
            if (!found.length && Number(process.env.GITHUB_RUN_ATTEMPT) > 1)
              throw new Error('Original history plan is missing; start a new workflow run');
            core.setOutput('artifact', found[0]?.id || '');
      - if: matrix.toxenv == '' && steps.existing.outputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.existing.outputs.artifact }}
          merge-multiple: true
          path: .ci-runtime/plans
      - name: Freeze timing history separately for both locales
        if: matrix.toxenv == '' && steps.existing.outputs.artifact == ''
        run: |
          for variant in default bg-cp1251; do
            CI_RUNTIME_SUITE="xlsx2html/$PYTHON_VARIANT/$variant" \
            CI_RUNTIME_STATE=".ci-runtime/plans/$variant" python -m ci_runtime history-plan
          done
      - if: matrix.toxenv == '' && steps.existing.outputs.artifact == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.existing.outputs.name }}
          path: .ci-runtime/plans
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Run tests
        run: |
          if [ -z "$TOXENV" ]; then
            CI_RUNTIME_SUITE="xlsx2html/$PYTHON_VARIANT/default" \
            CI_RUNTIME_STATE=.ci-runtime/default \
            CI_RUNTIME_HISTORY_FILE=.ci-runtime/plans/default/history-plan.json \
            tox -e "$TOX_TESTENV" -- -p ci_runtime.pytest_plugin
          else
            tox
          fi
      - name: Set locale
        run: |
          sudo apt-get update && sudo apt-get install tzdata locales -y
          sudo localedef -f CP1251 -i /usr/share/i18n/locales/bg_BG /usr/lib/locale/bg_BG.CP1251
          sudo echo 'bg_BG.CP1251 CP1251' | sudo tee -a /etc/locale.gen > /dev/null
          sudo mkdir /usr/local/share/i18n
          sudo touch /usr/local/share/i18n/SUPPORTED
          sudo echo 'bg_BG.CP1251 CP1251' | sudo tee -a /usr/local/share/i18n/SUPPORTED > /dev/null
          sudo locale-gen bg_BG.UTF-8
          sudo locale-gen bg_BG
          sudo locale-gen
          sudo update-locale LANG=bg_BG.CP1251
          locale -a
          echo "Actual locale"
          locale
          echo "Actual numeric settings"
          locale -c -k LC_NUMERIC
          echo "LANG Variable"
          echo "$LANG"
          echo "LocaleCtl"
          localectl status
      - name: Run tests with another locale
        run: |
          if [ -z "$TOXENV" ]; then
            LC_ALL=bg_BG.CP1251 CI_RUNTIME_SUITE="xlsx2html/$PYTHON_VARIANT/bg-cp1251" \
            CI_RUNTIME_STATE=.ci-runtime/bg-cp1251 \
            CI_RUNTIME_HISTORY_FILE=.ci-runtime/plans/bg-cp1251/history-plan.json \
            tox -e "$TOX_TESTENV" -- -p ci_runtime.pytest_plugin
          else
            LC_ALL=bg_BG.CP1251 tox
          fi
      - uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45
        with:
          env_vars: OS,PYTHON,TOXENV

      - name: Test data
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: "test-data-${{ matrix.python-version }}-${{ matrix.toxenv }}-${{ github.run_number }}"
          include-hidden-files: true
          path: |
            ${{ github.workspace }}/.tests/
            ${{ github.workspace }}/tests/
            ${{ github.workspace }}/tests.*/


  publish:
    name: Build and publish Python distributions to PyPI and TestPyPI
    permissions:
      contents: write
    needs:
      - test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@master
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11
      - name: Install pypa/build
        run: >-
          python -m
          pip install
          build
          --user
      - name: Build a binary wheel and a source tarball
        run: >-
          python -m
          build
          --sdist
          --wheel
          --outdir dist/

      - name: Publish distribution to Test PyPI
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        if: github.ref == 'refs/heads/master' && env.TEST_PYPI_API_TOKEN != null
        uses: pypa/gh-action-pypi-publish@master
        with:
          skip_existing: true
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository_url: https://test.pypi.org/legacy/

      - name: Publish distribution to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@master
        with:
          skip_existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        if: ${{ !github.event.schedule && startsWith(github.ref, 'refs/tags') }}
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.whl
