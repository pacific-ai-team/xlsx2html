name: Durable CI artifacts
description: Prepare Node and the official artifact SDK for periodic test checkpoints
runs:
  using: composite
  steps:
    - name: Expose the job-scoped artifact service to the checkpoint uploader
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: |
          const path = require('node:path');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          if (!process.version.startsWith('v24.')) throw new Error('Artifact client requires Node 24');
          core.addPath(path.dirname(process.execPath));
          const tools = path.join(process.env.GITHUB_WORKSPACE, '.github', 'actions', 'ci-runtime', 'tools');
          const provenance = JSON.parse(fs.readFileSync(path.join(tools, 'dist', 'provenance.json'), 'utf8'));
          const digest = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          if (digest(path.join(tools, 'package-lock.json')) !== provenance.lock_sha256 ||
              digest(path.join(tools, 'build.mjs')) !== provenance.build_sha256)
            throw new Error('Artifact SDK source provenance changed; rebuild the helper');
          for (const [name, expected] of Object.entries(provenance.outputs)) {
            if (digest(path.join(tools, 'dist', name)) !== expected)
              throw new Error(`Artifact SDK bundle mismatch: ${name}`);
          }
          for (const key of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
            const value = process.env[key];
            if (!value) throw new Error(`Missing Actions artifact setting: ${key}`);
            core.setSecret(value);
            core.exportVariable(key, value);
          }
          core.exportVariable('CI_RUNTIME_ARTIFACT_SDK', path.join(tools, 'dist', 'artifact.cjs'));
