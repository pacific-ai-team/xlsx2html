name: Durable CI artifacts
description: Prepare Node and the official artifact SDK for periodic test checkpoints
runs:
  using: composite
  steps:
    - name: Expose the job-scoped artifact service to the checkpoint uploader
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: |
          const path = require('node:path');
          if (!process.version.startsWith('v24.')) throw new Error('Artifact client requires Node 24');
          core.addPath(path.dirname(process.execPath));
          for (const key of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
            const value = process.env[key];
            if (!value) throw new Error(`Missing Actions artifact setting: ${key}`);
            core.setSecret(value);
            core.exportVariable(key, value);
          }
          core.exportVariable('CI_RUNTIME_ARTIFACT_SDK', path.join(process.env.GITHUB_WORKSPACE,
            '.github', 'actions', 'ci-runtime', 'tools', 'node_modules', '@actions', 'artifact', 'lib', 'artifact.js'));
    - name: Install artifact client outside the repository dependencies
      shell: bash
      run: npm ci --prefix "${GITHUB_ACTION_PATH}/tools" --ignore-scripts --no-audit --no-fund
